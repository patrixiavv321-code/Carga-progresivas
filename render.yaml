services:
  - type: web
    name: gimnasio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/estado
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_CLAVE
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
